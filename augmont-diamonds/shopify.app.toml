# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "50747b00decadf54ddc0dd45d715d68f"
name = "Augmont-diamonds"
application_url = "https://claude-code-max-shopify-app-production.up.railway.app"
embedded = true

[build]
automatically_update_urls_on_dev = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
#
# Phase C / H1: minimal scope. The diamond catalog is fetched from Augmont
# (not Shopify), so write_products / metaobject scopes from the template
# default were never used and were App-Store-rejection bait. read_products
# is kept as a defensible reviewer-friendly minimum — leaves room for
# displaying Shopify product context inside admin without forcing a
# scope-update reinstall later.
scopes = "read_products"

[auth]
redirect_urls = [ "https://claude-code-max-shopify-app-production.up.railway.app/auth/callback" ]
